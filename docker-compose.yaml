version: "3.3"

services:
  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - couliglig_network

  fastapi-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi-app
    depends_on:
      - redis
    restart: always
    volumes:
      - ./db:/app/db
      # Optional dnsmasq-managed hosts file (host -> container)
      # - /var/lib/dnsmasq/robots.hosts:/data/robots.hosts
    environment:
      # legacy (each robot's RL loop) | bus (the coordinator below runs the fleet).
      # Set FLEET_MODE=bus in this directory's .env; the robots switch with it.
      - FLEET_MODE=${FLEET_MODE:-legacy}
      - AMQP_URL=amqp://${RABBITMQ_USER:-couliglig}:${RABBITMQ_PASS:-change-me}@rabbitmq:5672/
    #   - HOSTS_FILE=/data/robots.hosts
    ports:
      - "8000:8000"
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    networks:
      - couliglig_network

  # Fleet coordinator (Phase 2 of the MARL deployment redesign). The legacy
  # Redis path above keeps running until Phase 5.
  rabbitmq:
    image: rabbitmq:3.13.7-management
    container_name: rabbitmq
    restart: always
    hostname: rabbitmq            # keeps the node name, so durable queues survive recreation
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-couliglig}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:-change-me}
    ports:
      - "5672:5672"               # robots connect over the LAN
      - "15672:15672"             # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 6
    networks:
      - couliglig_network

  coordinator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coordinator
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - AMQP_URL=amqp://${RABBITMQ_USER:-couliglig}:${RABBITMQ_PASS:-change-me}@rabbitmq:5672/
    volumes:
      - ./db:/app/db              # db/coordinator.db and the maps
    command: ["python", "-m", "coordinator", "--config", "coordinator.yaml"]
    networks:
      - couliglig_network

  # SAM3 text-prompt segmentation + grasp server (sam3_server/), ZMQ on 5557.
  # Opt-in: docker compose --profile sam3 up -d --build sam3
  # Needs the Jetson's nvidia runtime and, in .env, HF_TOKEN (facebook/sam3 is
  # gated) and GRASPGEN_HOST (the GraspGen-couliglig machine). The weights
  # (~3.4 GB) download once into the sam3-hf-cache volume.
  sam3:
    profiles: ["sam3"]
    build:
      context: .
      dockerfile: Dockerfile.sam3
    image: couliglig-sam3
    container_name: sam3
    restart: unless-stopped
    runtime: nvidia
    environment:
      - GRASPGEN_HOST=${GRASPGEN_HOST:-192.168.20.113}
      - GRASPGEN_PORT=${GRASPGEN_PORT:-5556}
      - SAM3_POSE_MODE=${SAM3_POSE_MODE:-auto}   # manual: heuristic pose, no GraspGen
      - SAM3_FP16=1
      - HF_HOME=/hf-cache
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - sam3-hf-cache:/hf-cache
    ports:
      - "5557:5557"
    command: ["python", "-m", "sam3_server", "--host", "0.0.0.0", "--port", "5557"]

  # robot-watcher:
  #   build:
  #     context: .
  #   container_name: robot-watcher
  #   restart: always
  #   depends_on:
  #     - redis
  #   environment:
  #     - REDIS_HOST=redis
  #     - REDIS_PORT=6379
  #   command: ["python", "robot_watcher.py"]
  #   networks:
  #     - couliglig_network

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    restart: always
    network_mode: host
    volumes:
      - ./mediamtx.yml:/mediamtx.yml
    command: /mediamtx.yml

networks:
  couliglig_network:
    driver: bridge

volumes:
  rabbitmq-data:
  sam3-hf-cache:
